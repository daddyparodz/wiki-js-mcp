name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.repository == 'daddyparodz/wiki-js-mcp' &&
      github.actor_id == '45983094' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            resolution: lowest-direct
          - python: '3.14'
            resolution: highest
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.18
          uv pip compile requirements.txt --resolution ${{ matrix.resolution }} --only-binary :all: --output-file /tmp/requirements-lowest.txt
          uv pip sync --system /tmp/requirements-lowest.txt
          uv pip check --system
      - name: Run offline compatibility checks
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python --version
          python -m pytest tests/test_security_dependencies.py --collect-only -q
          python -m pytest tests/test_security_dependencies.py -q
