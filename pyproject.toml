[tool.poetry]
name = "wiki-js-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Wiki.js integration with hierarchical documentation support"
authors = ["Sahil Pethe <workpethesahil@proton.me>"]
license = "MIT"
readme = "README.md"
packages = [{include = "wiki_mcp_server.py", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastmcp = ">=3.4.10,<4.0.0"
httpx = "^0.28.1"
# Security floor for JWT support used by MCP dependencies.
pyjwt = ">=2.15.0,<3.0.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-slugify = "^8.0"
markdown = "^3.8.1"
beautifulsoup4 = "^4.12"
python-dotenv = "^1.2.2"
sqlalchemy = "^2.0"
tenacity = "^8.0"
aiosqlite = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = ">=1.3.0,<2.0.0"
black = "^26.10.1"
isort = "^5.12.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
wikijs-mcp = "wiki_mcp_server:main"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true 